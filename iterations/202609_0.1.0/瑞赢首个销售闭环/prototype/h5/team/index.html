<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>团队处理 · 瑞赢 0.1 企微 H5 原型</title>
<link rel="stylesheet" href="../../assets/css/common.css">
<link rel="stylesheet" href="../../assets/css/h5-common.css">
<style>
  .team-intro { color:var(--muted); font-size:12px; line-height:1.7; margin:4px 2px 14px; }
  .team-links { display:grid; gap:10px; }
  .team-link { display:flex; align-items:center; gap:12px; padding:15px 14px; border:1px solid var(--line); background:var(--surface); border-radius:12px; color:var(--ink); text-decoration:none; }
  .team-link:active { background:var(--brand-soft); }
  .team-link__ico { display:grid; place-items:center; width:38px; height:38px; flex:none; border-radius:10px; color:var(--brand-ink); background:var(--brand-soft); font-weight:700; }
  .team-link__body { flex:1; min-width:0; }
  .team-link__body b { display:block; font-size:14px; }
  .team-link__body small { display:block; margin-top:4px; font-size:11px; line-height:1.5; color:var(--muted); }
  .team-link__arrow { color:var(--faint); font-size:18px; }
</style>
</head>
<body class="ry-app" data-root="../../" data-end="h5">
<div class="ry-bar ry-bar--brand" id="ry-hbar"></div>
<div class="ry-body ry-body--pad-bottom">
  <p class="team-intro">选择要处理的团队业务，操作将在原业务页面完成。</p>
  <div class="team-links">
    <a class="team-link" href="../lead/list.html?scope=team"><span class="team-link__ico">线</span><span class="team-link__body"><b>团队线索</b><small>查看线索，按权限单条分派或转交</small></span><span class="team-link__arrow">›</span></a>
    <a class="team-link" href="../task/list.html?scope=team"><span class="team-link__ico">任</span><span class="team-link__body"><b>团队任务</b><small>查看、单条派单和催办</small></span><span class="team-link__arrow">›</span></a>
    <a class="team-link" href="../report/team.html"><span class="team-link__ico">报</span><span class="team-link__body"><b>团队日报</b><small>阅读并追加建议</small></span><span class="team-link__arrow">›</span></a>
    <a class="team-link" href="../visit/list.html?scope=team&amp;exception=1"><span class="team-link__ico">访</span><span class="team-link__body"><b>团队拜访</b><small>查看证据并单条复核异常</small></span><span class="team-link__arrow">›</span></a>
  </div>
</div>
<nav class="ry-tabbar" id="ry-htabs"></nav>
<script src="../../assets/js/demo-data.js"></script>
<script src="../../assets/js/prototype-store.js"></script>
<script src="../../assets/js/permissions.js"></script>
<script src="../../assets/js/common-actions.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/page-manifest.js"></script>
<script>
RY.nav.h5shell({ title:'团队处理', sub:'线索 · 任务 · 日报 · 拜访', nav:'home', tabbar:true });
</script>
<script src="../../assets/js/h5-page-notes.js"></script>
</body>
</html>
