<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>知识管理 · 瑞赢 0.1 PC 原型</title>
<link rel="stylesheet" href="../../assets/css/common.css">
<link rel="stylesheet" href="../../assets/css/pc-common.css">
<style>
  /* 页面专属样式：知识管理（发布与停用；维护权限可组合，不设固定知识管理员角色） */
  .kl-cols { display: block; }
  .kl-scope { font-size: 11.5px; color: var(--muted); }
  @media (max-width: 1180px) { .kl-cols { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body data-root="../../">

<div class="ry-app">
  <aside class="ry-side" id="ry-side"></aside>
  <div class="ry-main">
    <header class="ry-top" id="ry-top"></header>
    <div class="ry-head" id="ry-head"></div>
    <main class="ry-page" id="ry-page">
      <div id="kl-host"></div>
    </main>
  </div>
</div>

<script src="../../assets/js/demo-data.js"></script>
<script src="../../assets/js/prototype-store.js"></script>
<script src="../../assets/js/permissions.js"></script>
<script src="../../assets/js/pc-permissions-0-1.js"></script>
<script src="../../assets/js/common-actions.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/page-manifest.js"></script>
<script>
(function () {
  'use strict';
  var ui = RY.ui, S = RY.store, P = RY.perm;
  var PAGE = 'knowledge.manage';
  var canCreate = P.can('knowledge.create');
  var canPublish = P.can('knowledge.publish');
  var canDeactivate = P.can('knowledge.deactivate');
  var STATUS = ['已发布', '草稿', '已停用'];
  var tab = ui.hash() || '已发布';
  var kw = '';

  RY.nav.shell({
    nav: PAGE,
    title: '知识管理',
    subtitle: '维护知识文档、发布范围和版本状态。',
    crumbs: [{ label: '首页', href: 'pc.html' }, { label: '系统管理' }, { label: '知识管理' }],
    actions: '<a class="ry-btn" href="../ai/ops.html">AI 运行记录</a>'
  });

  var g = P.guard(PAGE, null, null);
  if (!g.ok) {
    ui.qs('#kl-host').innerHTML = ui.stateCard(g.kind, {
      title: '当前身份不可进入知识管理',
      body: '<p>' + ui.esc(g.reason) + '</p><p class="ry-hint">无权时不展示文档标题、发布范围与操作日志。</p>'
    });
    return;
  }

  function all() { return S.all('knowledge'); }
  function filtered() {
    var k = kw.trim().toLowerCase();
    return all().filter(function (x) {
      if (x.status !== tab) return false;
      if (k && (x.title + x.code + x.summary).toLowerCase().indexOf(k) < 0) return false;
      return true;
    });
  }
  function scopeTone(scope) {
    if (String(scope).indexOf('全员') >= 0) return 'brand';
    if (String(scope).indexOf('指定角色') >= 0) return 'info';
    return 'muted';
  }

  function render() {
    if (STATUS.indexOf(tab) < 0) tab = '已发布';
    var list = all(), rows = filtered();
    var cnt = function (s) { return list.filter(function (x) { return x.status === s; }).length; };

    ui.qs('#kl-host').innerHTML =
      '<div class="ry-card" style="margin:12px 0"><div class="ry-card__body">' +
        '<div class="ry-filter__row">' +
          ui.field('关键词', ui.input('kl-kw', kw, '标题／编码／摘要'), '', false) +
        '</div>' +
        '<div class="ry-filter__act"><button class="ry-btn" id="kl-reset">重置</button>' +
          '<button class="ry-btn ry-btn--primary" id="kl-apply">查询</button></div>' +
      '</div></div>' +

      '<div style="display:flex;gap:6px;margin-bottom:10px;align-items:center">' +
        STATUS.map(function (s) {
          return '<button class="ry-btn ry-btn--sm' + (tab === s ? ' ry-btn--primary' : '') + '" data-kl-t="' + s + '">' +
            s + '（' + cnt(s) + '）</button>';
        }).join('') +
        '<button type="button" data-pcn-rule="knowledgeLifecycle"></button>' +
        (canCreate ? '<span style="flex:1"></span><a class="ry-btn ry-btn--primary" href="create.html">新建知识文档</a>' : '') +
      '</div>' +

      '<div class="kl-cols">' +
        '<div>' +
          (rows.length
            ? '<div class="ry-table__wrap"><table class="ry-table ry-table--tight"><thead><tr>' +
              '<th>文档</th><th style="width:80px">版本</th><th style="width:190px">发布范围 <button type="button" data-pcn-rule="knowledgeScope"></button></th>' +
              '<th style="width:110px">维护人</th><th style="width:140px">发布时间</th><th style="width:110px">状态</th><th style="width:210px">操作 <button type="button" data-pcn-rule="knowledgePublish"></button></th>' +
              '</tr></thead><tbody>' + rows.map(function (x) {
                return '<tr>' +
                  '<td><a class="ry-cellname" href="detail.html?id=' + encodeURIComponent(x.id) + '">' + ui.esc(x.title) + '</a>' +
                    '<div class="ry-hint"><span class="ry-code">' + ui.esc(x.code) + '</span>　' + ui.esc(x.summary) + '</div></td>' +
                  '<td><span class="ry-code">' + ui.esc(x.version) + '</span></td>' +
                  '<td>' + ui.tag(x.scope, scopeTone(x.scope)) +
                    '<div class="kl-scope">' + (S.knowledgeInPublishScope(x, S.currentUser()) ? '当前身份在范围内' : '当前身份不在范围内') + '</div></td>' +
                  '<td>' + ui.esc(S.userName(x.owner) || x.owner) + '</td>' +
                  '<td class="ry-hint">' + ui.esc(x.publishedAt || '未发布') + '</td>' +
                  '<td>' + ui.statusTag(x.status) + (x.pendingDraft ? '<div class="ry-hint">有待发布修改</div>' : '') + '</td>' +
                  '<td class="ry-tbl-act">' +
                    '<a class="ry-btn ry-btn--sm" href="detail.html?id=' + encodeURIComponent(x.id) + '">详情</a>' +
                    (x.status === '草稿' && canPublish ? '<button class="ry-btn ry-btn--sm ry-btn--primary" data-kl-pub="' + x.id + '">发布</button>' : '') +
                    (x.status === '已发布' && canDeactivate ? '<button class="ry-btn ry-btn--sm" data-kl-off="' + x.id + '">停用</button>' : '') +
                  '</td></tr>';
              }).join('') + '</tbody></table></div>'
            : ui.stateCard('empty', { title: '当前没有「' + tab + '」的知识文档' })) +
        '</div>' +

      '</div>' +

      '';

    bind();
    ui.bindDenied('#ry-page');
  }

  function bind() {
    ui.qs('#kl-apply').addEventListener('click', function () {
      var v = ui.formValues(ui.qs('#kl-host')); kw = v['kl-kw'] || ''; render();
    });
    ui.qs('#kl-reset').addEventListener('click', function () { kw = ''; render(); });
    ui.qsa('[data-kl-t]').forEach(function (b) {
      b.addEventListener('click', function () { tab = b.getAttribute('data-kl-t'); window.location.hash = tab; render(); });
    });
    ui.qsa('[data-kl-pub]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        if (e.target.closest('[data-denied]')) return;
        publish(b.getAttribute('data-kl-pub'));
      });
    });
    ui.qsa('[data-kl-off]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        if (e.target.closest('[data-denied]')) return;
        deactivate(b.getAttribute('data-kl-off'));
      });
    });
  }

  function publish(id) {
    var x = S.kb(id);
    ui.confirm({
      title: '发布知识文档　' + x.title,
      message: '<p>发布后该版本进入全局搜索与 Agent 检索，范围：<b>' + ui.esc(x.scope) + '</b>。</p>' +
        '<p class="ry-hint">只有<b>已发布且在范围内</b>的用户能检索到它；' +
        'Agent 检索时仍然只读<b>调用者有权访问</b>的版本，不因发布而扩大任何人的可见范围。</p>' +
        (S.knowledgeInPublishScope({ scope: x.scope, status: '已发布' }, S.currentUser())
          ? '<p class="ry-hint">当前身份在发布范围内。</p>'
          : '<p class="ry-hint">注意：当前身份不在该发布范围内，发布后自己也检索不到。</p>'),
      confirmText: '确认发布',
      onConfirm: function () {
        var r = S.knowledgePublish(id, '管理页发布');
        ui.toast(r.ok ? '已发布。' : r.msg, r.ok ? 'success' : 'warn');
        render();
      }
    });
  }

  function deactivate(id) {
    var x = S.kb(id);
    ui.confirm({
      title: '停用知识文档　' + x.title,
      message: '<p>停用后：退出全局搜索，<b>不再作为 Agent 新回答的来源</b>。</p>' +
        '<p class="ry-hint"><b>停用不删除历史</b>：文档与操作日志保留，' +
        '历史上的回答仍可回溯到当时的版本。已经产生的业务记录不受影响。</p>',
      requireReason: true, reasonLabel: '停用原因', confirmText: '确认停用', danger: true,
      onConfirm: function (reason) {
        var r = S.knowledgeDeactivate(id, reason);
        ui.toast(r.ok ? '已停用。' : r.msg, r.ok ? 'success' : 'warn');
        render();
      }
    });
  }

  render();
})();
</script>
<script src="../../assets/js/pc-page-notes.js"></script>
</body>
</html>
