      g.appendChild(textNode(X_L2 + 24, n.top + H_L2 / 2, b.name, 12.5, "#2C2C2A", "500"));
      g.appendChild(textNode(X_L2 + W_L2 - 12, n.top + H_L2 / 2, String(b.children.length), 11, "#888780", null, "end"));
      g.addEventListener("click", () => { b.open = !b.open; render(); });
      svg.appendChild(g);
    } else {
      const d = n.data, c = TYPE_COLOR[d.type] || ["#F1EFE8", "#444441"];
      const hot = keyword && matches(d);
      const g = el("g", {style: "cursor:pointer"});
      g.appendChild(el("rect", {x: X_LEAF, y: n.top, width: W_LEAF, height: H_LEAF, rx: 8,
        fill: hot ? "#FAEEDA" : "#FFFFFF", stroke: hot ? "#EF9F27" : "#E3E2DC",
        "stroke-width": hot ? "1.2" : "0.9"}));
      g.appendChild(el("rect", {x: X_LEAF + 10, y: n.top + 7, width: 44, height: 14, rx: 4,
        fill: c[0], stroke: "none"}));
      g.appendChild(textNode(X_LEAF + 32, n.top + H_LEAF / 2, d.type, 10.5, c[1], null, "middle"));
      g.appendChild(textNode(X_LEAF + 66, n.top + H_LEAF / 2, d.name, 12.5, "#2C2C2A"));
      g.appendChild(textNode(X_LEAF + W_LEAF - 12, n.top + H_LEAF / 2, d.meta, 11, "#888780", null, "end"));
      g.addEventListener("click", () => { selected = d; showPanel(); });
      svg.appendChild(g);
    }
  });

  const shown = L.nodes.filter(x => x.kind === "leaf").length;
  document.getElementById("stat").innerHTML = "<b>" + TREE.children.length + "</b> 个功能模块 · <b>" +
    (keyword ? shown + " / " + 95 : 95) + "</b> 个操作";
}

function showPanel() {
  const p = document.getElementById("panel");
  if (!selected) { p.classList.remove("on"); return; }
  const d = selected.detail;
  const order = ["一级模块", "二级模块", "操作名称", "操作类型", "执行角色", "适用端", "前置状态", "校验与阻断", "操作结果", "涉及字段", "权限项", "审计留痕", "页面契约", "来源章节"];
  let html = '<h2>' + esc(d["操作名称"]) + '</h2><div class="sub">' + esc(d["一级模块"]) + " · " + esc(d["二级模块"]) + "</div>";
  order.forEach(k => {
    if (k === "操作名称" || k === "一级模块" || k === "二级模块") return;
    html += '<div class="prow"><div class="k">' + esc(k) + '</div><div class="v">' + esc(d[k]) + "</div></div>";
  });
  p.innerHTML = html;
  p.classList.add("on");
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
}

document.getElementById("q").addEventListener("input", e => {
  keyword = e.target.value.trim().toLowerCase();
  if (keyword) TREE.children.forEach(b => { if (b.children.some(matches)) b.open = true; });
  render();
});
document.getElementById("expand").addEventListener("click", () => { TREE.children.forEach(b => b.open = true); render(); });
document.getElementById("collapse").addEventListener("click", () => { TREE.children.forEach(b => b.open = false); render(); });
document.getElementById("locate").addEventListener("click", () => locateRoot());

function locateRoot() {
  const c = document.getElementById("canvas");
  c.scrollTop = Math.max(0, 16 + lastRootCenter - c.clientHeight / 2);
}

const LG = [["查看", "读"], ["新建", "建"], ["编辑", "改"], ["状态动作", "状态"], ["归属动作", "归属"], ["治理", "治"], ["系统", "系统"]];
const seen = {};
LG.forEach(([t, label]) => {
  const c = TYPE_COLOR[t]; if (!c || seen[t]) return; seen[t] = 1;
  const s = document.createElement("span");
  s.className = "lg";
  s.innerHTML = '<i class="dot" style="background:' + c[0] + ';border:1px solid ' + c[1] + '"></i>' + t;
  document.getElementById("legend").appendChild(s);
});

render();
locateRoot();
</script>
</body>
</html>
