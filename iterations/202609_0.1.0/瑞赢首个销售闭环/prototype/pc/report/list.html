          var v = ui.formValues(el);
          var note = (v.text || '').trim();
          var res = r.demo ? (note ? (r.advices.push({ by:u.id, at:S.now(), text:note }), r.history.push({ at:S.now(), actor:u.name, action:'追加建议' }), { ok:true }) : { ok:false, msg:'请填写建议内容。' }) : S.addReportAdvice(id, note);
          if (!res.ok) { ui.toast(res.msg, 'warn'); return; }
          ui.close(); ui.toast('建议已追加。', 'success'); render();
        });
      }
    });
  }

  ui.qs('#rl-apply').addEventListener('click', function () {
    var v = ui.formValues(ui.qs('#rl-filter'));
    flt.kw = v.kw; flt.status = v.status; flt.user = v.user; flt.from = v.from; flt.to = v.to; flt.read = v.read;
    if (flt.from || flt.to) viewMode = 'range';
    else if (viewMode === 'range') viewMode = 'week';
    ui.qs('#rl-more').textContent = extraFilterLabel();
    selectedDay = ''; page = 1; st.page = 1; st.flt = flt; S.save(); render();
  });
  ui.qs('#rl-reset').addEventListener('click', function () {
    Object.keys(flt).forEach(function (k) { flt[k] = ''; });
    viewMode = 'week'; periodAnchor = null; selectedDay = ''; moreFilters = false; st.moreFilters = false;
    page = 1; st.page = 1; S.save();
    ui.qs('#rl-filter').querySelectorAll('input,select').forEach(function (x) {
      if (x.tagName === 'SELECT') x.selectedIndex = 0; else x.value = '';
    });
    ui.qs('#rl-more-fields').hidden = true;
    ui.qs('#rl-more').setAttribute('aria-expanded', 'false');
    ui.qs('#rl-more').textContent = '更多筛选';
    render();
  });

  var ex = ui.qs('#rl-exp');
  if (ex) ex.addEventListener('click', function (e) {
    if (e.target.closest('[data-denied]')) return;
    ui.modal({
      title: '导出日报', size: 'sm',
      body: '<p>将导出当前范围与筛选结果中的正式日报 <b>' + filtered().filter(function (r) { return !r.demo; }).length + '</b> 份。' + rule('reportExport') + '</p>',
      footer: '<button class="ry-btn" data-close>取消</button><button class="ry-btn ry-btn--primary" id="rl-exp-ok"' + (filtered().some(function (r) { return !r.demo; }) ? '' : ' disabled') + '>提交导出</button>',
      onOpen: function (el) {
        ui.qs('#rl-exp-ok', el).addEventListener('click', function () {
          ui.close();
          var n = filtered().filter(function (r) { return !r.demo; }).length;
          var job = S.addJob({
            type: '导出', action: '日报导出', object: '日报', status: '处理中', total: n,
            fields: ['日报编号', '提交人', '日期', '状态', '提交时间', '正文'],
            fileName: '日报_' + S.today().replace(/-/g, '') + '.xlsx'
          });
          ui.asyncRun({
            title: '正在生成导出文件', total: n, processId: job.processId,
            onDone: function () {
              S.updateJob(job.id, { status: '已完成', success: n, failed: 0 });
              ui.closeAll(); ui.toast('导出已完成，可在处理记录下载。', 'success');
            }
          });
        });
      }
    });
  });

  render();
})();
</script>
<script src="../../assets/js/pc-page-notes.js"></script>
</body>
</html>
