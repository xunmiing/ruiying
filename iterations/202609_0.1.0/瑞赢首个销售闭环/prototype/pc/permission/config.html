<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>权限配置 · 瑞赢 0.1 PC 原型</title>
<link rel="stylesheet" href="../../assets/css/common.css">
<link rel="stylesheet" href="../../assets/css/pc-common.css">
<style>
  /* 页面专属样式：三个角色的功能列表与按钮权限 */
  .pm-cols { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 14px; align-items: start; }
  .pm-roles { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); padding: 8px; }
  .pm-role { display: block; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .pm-role:hover { background: var(--line-soft); }
  .pm-role.is-on { background: var(--brand-soft); }
  .pm-role__n { font-size: 13px; font-weight: 600; color: var(--ink); }
  .pm-role.is-on .pm-role__n { color: var(--brand-ink); }
  .pm-role__d { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin-top: 2px; }
  .pm-grp { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); margin-bottom: 10px; overflow: hidden; }
  .pm-grp__h { padding: 8px 12px; background: #FBFCFC; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; font-weight: 600; }
  .pm-row { display: grid; grid-template-columns: minmax(0, 1fr) 74px 74px 74px 74px 74px; gap: 6px; padding: 7px 12px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; align-items: center; }
  .pm-row:last-child { border-bottom: none; }
  .pm-row--h { background: #FCFDFD; color: var(--muted); font-size: 11.5px; }
  .pm-row > b { font-weight: 600; }
  .pm-row > b.on { color: var(--brand-ink); }
  .pm-row > b.off { color: var(--faint); font-weight: 400; }
  .pm-c { text-align: center; }
  .pm-c input { accent-color: var(--brand); }
  .pm-cap { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 88px); gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; align-items: center; }
  .pm-cap:last-child { border-bottom: none; }
  @media (max-width: 1180px) { .pm-cols { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body data-root="../../">

<div class="ry-app">
  <aside class="ry-side" id="ry-side"></aside>
  <div class="ry-main">
    <header class="ry-top" id="ry-top"></header>
    <div class="ry-head" id="ry-head"></div>
    <main class="ry-page" id="ry-page">
      <div id="pm-host"></div>
    </main>
  </div>
</div>

<script src="../../assets/js/demo-data.js"></script>
<script src="../../assets/js/prototype-store.js"></script>
<script src="../../assets/js/permissions.js"></script>
<script src="../../assets/js/pc-permissions-0-1.js"></script>
<script src="../../assets/js/common-actions.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/page-manifest.js"></script>
<script>
(function () {
  'use strict';
  var ui=RY.ui, P=RY.perm, S=RY.store;
  var ROLES=['R1','R2','R3'];
  var names={R1:'销售',R2:'销售主管/经理',R3:'管理员（运营）'};
  RY.nav.shell({nav:'perm.config',title:'权限配置',subtitle:'配置功能列表权限和按钮权限；数据范围由三个角色固定决定。',
    crumbs:[{label:'首页',href:'pc.html'},{label:'系统管理'},{label:'人员与权限'},{label:'权限配置'}]});
  var guard=P.guard('perm.config');
  if(!guard.ok){ui.qs('#pm-host').innerHTML=ui.stateCard(guard.kind,{title:'无权限',body:ui.esc(guard.reason)});return;}
  var tab='pages';
  function matrix(){return S.uiState('pcThreeRoleMatrix',null)||{};}
  function rows(group){return group==='pages'?P.PAGES:P.ACTIONS;}
  function list(group,key){return ((matrix()[group]||{})[key]||rows(group)[key]||[]).slice();}
  function draw(){
    var groups={pages:['功能列表','页面'],actions:['按钮权限','按钮']};
    ui.qs('#pm-host').innerHTML='<div class="ry-card"><div class="ry-card__body">'+
      '<p>仅保留 <b>销售、销售主管/经理、管理员（运营）</b> 三个人工角色。页面入口按功能列表授权，操作按按钮授权；不配置字段范围或明文查看权限。</p>'+
      '<p class="ry-hint">固定数据范围 <button type="button" data-perm-note="scope">◆ 范围规则</button>：销售可看本人负责、协作、所属池待认领线索和全国公海；主管/经理增加本团队；管理员（运营）看全部业务数据。查看与修改是不同的权限。</p>'+
      '<div style="display:flex;gap:8px;margin-bottom:12px">'+Object.keys(groups).map(function(g){return '<button class="ry-btn ry-btn--sm'+(tab===g?' ry-btn--primary':'')+'" data-tab="'+g+'">'+groups[g][0]+'</button>';}).join('')+'</div>'+
      '<div class="ry-table__wrap"><table class="ry-table ry-table--tight"><thead><tr><th>'+groups[tab][1]+'</th><th>销售</th><th>销售主管/经理</th><th>管理员（运营）</th></tr></thead><tbody>'+
      Object.keys(rows(tab)).filter(function(k){return tab!=='pages'||(k.indexOf('h5.')!==0&&k!=='agent.service');}).map(function(k){
        var allowed=list(tab,k);
        return '<tr><td>'+ui.esc(k)+'</td>'+ROLES.map(function(r){return '<td><input type="checkbox" data-cell="'+tab+'|'+ui.esc(k)+'|'+r+'"'+(allowed.indexOf(r)>=0?' checked':'')+'></td>';}).join('')+'</tr>';
      }).join('')+'</tbody></table></div>'+
      '<p class="ry-hint">此页为原型演示配置；保存后在当前演示会话生效，生产权限由服务端执行。</p>'+
      '</div></div>';
    ui.qs('#pm-host').querySelectorAll('[data-tab]').forEach(function(el){el.onclick=function(){tab=el.dataset.tab;draw();};});
    ui.qs('#pm-host').querySelectorAll('[data-cell]').forEach(function(el){el.onchange=function(){
      var a=el.dataset.cell.split('|'), values=list(a[0],a[1]), at=values.indexOf(a[2]);
      if(el.checked&&at<0)values.push(a[2]);if(!el.checked&&at>=0)values.splice(at,1);
      P.setMatrix(a[0],a[1],values);
      ui.toast('演示权限已保存','success');
    };});
  }
  draw();
})();
</script>
<script src="../../assets/js/pc-page-notes.js"></script>
</body>
</html>
