<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会议进行中 · 瑞赢 0.1 企微 H5 原型</title>
<link rel="stylesheet" href="../../assets/css/common.css"><link rel="stylesheet" href="../../assets/css/h5-common.css">
</head>
<body class="ry-app" data-root="../../" data-end="h5">
<div class="ry-bar ry-bar--brand" id="ry-hbar"></div>
<div class="ry-body ry-body--pad-bottom"><div id="mt-host"></div></div>
<nav class="ry-tabbar" id="ry-htabs"></nav>
<script src="../../assets/js/demo-data.js"></script><script src="../../assets/js/prototype-store.js"></script>
<script src="../../assets/js/permissions.js"></script><script src="../../assets/js/common-actions.js"></script>
<script src="../../assets/js/navigation.js"></script><script src="../../assets/js/page-manifest.js"></script>
<script>
(function () {
  'use strict';
  var ui = RY.ui, S = RY.store, P = RY.perm, id = ui.q('id');
  var t = id ? S.task(id) : null;
  RY.nav.h5shell({ title: '会议进行中', sub: 'M24／M25 · 文字记录、纪要与分工', back: 'h5/task/detail.html?id=' + encodeURIComponent(id || ''), tabbar: false });
  var guard = t && t.meeting ? P.guard('h5.task.detail', 'tasks', id) : { ok: false, kind: 'unavailable', reason: '会议任务不存在' };
  if (!guard.ok) {
    ui.qs('#mt-host').innerHTML = ui.stateCard(guard.kind, { title: '会议任务不可用', body: '<p>' + ui.esc(guard.reason) + '</p>',
      actions: '<a class="ry-btn" href="list.html">返回任务列表</a>' }); return;
  }
  function render() {
    t = S.task(id);
    var editable = t.owner === S.currentUser().id && t.status === '待处理';
    var m = t.meeting || {};
    ui.qs('#mt-host').innerHTML =
      '<div class="ry-brief"><b>' + ui.esc(t.name) + '</b> ' + ui.statusTag(t.status) +
      '<p class="ry-hint">会议时间 ' + ui.esc((m.at || '—') + (m.endAt ? ' — ' + m.endAt : '')) + ' · 负责人 ' + ui.esc(S.userName(t.owner)) +
      ' · 参与人 ' + ui.esc((t.collaborators && t.collaborators.length ? t.collaborators : (m.attendeeIds || [])).map(S.userName).join('、') || m.attendees || '无') + '</p>' +
      '<p class="ry-hint">' + ui.esc(m.mode || '会议方式未设置') + ' · ' + ui.esc(m.mode === '线上' ? m.link || '会议链接未设置' : m.location || '会议地点未设置') + '</p>' +
      '<p class="ry-hint">本期使用文字上传或粘贴。录音和自动转写后续接入；不按分工复制正式任务。</p></div>' +
      '<div class="ry-hcard"><div class="ry-hcard__head"><h3>M24 · 会议文字记录</h3></div><div class="ry-hcard__body">' +
      (editable ? '<input type="file" id="mt-file" accept=".txt,.md,text/plain,text/markdown"><p class="ry-hint">可上传 txt／md，也可直接在下方填写。</p>' +
        ui.field('会议文字', ui.textarea('text', m.text || '', '粘贴会议发言与记录', 6), '', true) :
        '<p>' + ui.esc(m.text || '暂无会议文字') + '</p>') + '</div></div>' +
      '<div class="ry-hcard"><div class="ry-hcard__head"><h3>M25 · 纪要与分工</h3></div><div class="ry-hcard__body">' +
      (editable ? ui.field('会议纪要', ui.textarea('minutes', m.minutes || '', '事实、结论与待核对事项', 4)) +
        ui.field('参与人分工', ui.textarea('assignments', m.assignments || '', '注明参与人、事项与截止时间', 4)) +
        '<button class="ry-btn ry-btn--primary" id="mt-save">保存文字与纪要</button>' +
        '<button class="ry-btn" id="mt-complete">完成会议任务</button>' :
        ui.kv([['纪要', ui.esc(m.minutes || '—')], ['分工', ui.esc(m.assignments || '—')], ['完成成果', ui.esc(t.result || '—')]])) +
      '<p class="ry-hint">纪要确认后仍沿用当前任务 ID；参与人可在任务详情补充本人成果。正式任务完成由负责人提交。</p></div></div>' +
      '<div class="ry-acts-row"><a class="ry-btn" href="detail.html?id=' + encodeURIComponent(id) + '">查看任务详情与日志</a></div>';
    if (!editable) return;
    ui.qs('#mt-file').addEventListener('change', function () {
      var file = this.files && this.files[0];
      if (!file) return;
      if (!/\.(txt|md)$/i.test(file.name)) { ui.toast('仅支持文字文件', 'warn'); return; }
      var reader = new FileReader();
      reader.onload = function () { ui.qs('[name=text]').value = String(reader.result || ''); };
      reader.readAsText(file);
    });
    ui.qs('#mt-save').addEventListener('click', function () {
      var v = ui.formValues(ui.qs('#mt-host'));
      var r = S.saveMeetingRecord(id, v.text, v.minutes, v.assignments);
      ui.toast(r.msg, r.ok ? 'ok' : 'warn'); if (r.ok) render();
    });
    ui.qs('#mt-complete').addEventListener('click', function () {
      var v = ui.formValues(ui.qs('#mt-host'));
      var saved = S.saveMeetingRecord(id, v.text, v.minutes, v.assignments);
      if (!saved.ok) { ui.toast(saved.msg, 'warn'); return; }
      var done = S.taskAct(id, '完成', { result: v.minutes || '会议文字与分工已确认' });
      ui.toast(done.msg, done.ok ? 'ok' : 'warn'); render();
    });
  }
  render();
})();
</script>
</body>
</html>
