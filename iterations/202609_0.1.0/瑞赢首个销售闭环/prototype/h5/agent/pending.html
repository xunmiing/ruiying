<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 待处理 · 瑞赢 0.1 企微 H5 原型</title>
<link rel="stylesheet" href="../../assets/css/common.css">
<link rel="stylesheet" href="../../assets/css/h5-common.css">
<style>
  /* 页面专属样式：AI 待处理（历史待处理 / 写入失败 / 失败分类 / 重试校验 / 已失效）。 */
  .ap-row { border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; margin-bottom: 8px; background: var(--surface); }
  .ap-row__t { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ap-row__t b { font-size: 13px; }
  .ap-row__m { font-size: 11.5px; color: var(--muted); line-height: 1.85; margin-top: 5px; }
  .ap-row__m code { font-family: var(--mono); font-size: 11px; }
  .ap-sec { margin: 12px 0 6px; font-size: 12.5px; font-weight: 600; }
</style>
</head>
<body class="ry-app" data-root="../../" data-end="h5">

<div class="ry-bar ry-bar--brand" id="ry-hbar"></div>

<div class="ry-body ry-body--pad-bottom">
  <div id="ap-host"></div>
</div>

<nav class="ry-tabbar" id="ry-htabs"></nav>

<script src="../../assets/js/demo-data.js"></script>
<script src="../../assets/js/prototype-store.js"></script>
<script src="../../assets/js/permissions.js"></script>
<script src="../../assets/js/common-actions.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/page-manifest.js"></script>
<script>
(function () {
  'use strict';
  var ui = RY.ui, S = RY.store, P = RY.perm;

  var PAGE = 'h5.agent.pending';

  RY.nav.h5shell({
    title: 'AI 待处理',
    sub: '历史待处理 · 写入失败 · 已失效',
    back: 'h5/agent/index.html',
    nav: 'more',
    tabbar: true
  });

  /* ---------------------------------------------------------- 鉴权 */
  if (!P.page(PAGE)) {
    ui.qs('#ap-host').innerHTML = ui.stateCard('no-permission', {
      title: '没有 AI 待处理的访问权限',
      body: '<p>' + ui.esc(P.whyNot('agent.candidateConfirm') || '当前身份没有「AI 待处理」页面权限。') + '</p>' +
            '<p class="ry-hint">待处理列表是候选生命周期与写入失败的集中入口，进入仍需数据范围与对象状态校验。</p>',
      actions: '<a class="ry-btn" href="' + RY.nav.href('h5/agent/index.html') + '">返回瑞赢 AI</a>'
    });
    return;
  }

  var u = S.currentUser();
  var state = { tab: '历史待处理' };

  /* ---------------------------------------------------------- 数据 */

  function invalidList() { return S.candidateList({}).filter(function (c) { return c.status === '已失效'; }); }
  function businessFail(c) { return String(c.failKind || '').indexOf('不可自动重试') >= 0; }

  /* Run 失败记录：只展示技术元数据；来源全文不在本页展示，也无权查看他人运行的业务原文。 */
  function failedRuns() {
    return S.agentRunList('失败').filter(function (r) { return r.userId === u.id || u.role === 'R5'; });
  }

  function tabs() { return ['历史待处理', '写入失败', '已失效']; }

  function listOf(tab) {
    if (tab === '历史待处理') return S.candidateList({ age: '历史待处理' });
    if (tab === '写入失败') return S.candidateList({ writeFail: true });
    return invalidList();
  }

  /* ---------------------------------------------------------- 渲染 */

  function head(c) {
    var s = ui.statusTag(c.status);
    if (c.writeStatus === '写入失败') s += ' ' + ui.tag('写入失败', 'bad');
    if (c.status === '已失效') s += ' ' + ui.tag('不能继续确认', 'bad');
    return '<div class="ap-row__t"><b>' + ui.esc(c.kind) + '</b><span>' + s + '</span></div>';
  }

  function meta(c) {
    return '<div class="ap-row__m">' + ui.esc(c.id) + '　' + ui.esc(c.origin) + '　' +
      ui.esc(c.sourceRef.type) + ' ' + ui.esc(c.sourceRef.id) +
      (c.sourceRef.name ? '（' + ui.esc(c.sourceRef.name) + '）' : '') + '<br>' +
      '来源版本：' + ui.esc(c.sourceVersion) + '<br>' +
      '生成时间 ' + ui.esc(c.createdAt) + '　Run ID <code>' + ui.esc(c.runId) + '</code>　幂等键 <code>' + ui.esc(c.idemKey) + '</code>' +
      (c.failReason ? '<br>失败分类：' + ui.esc(c.failKind) + '　原因：' + ui.esc(c.failReason) : '') +
      (c.ignoreReason ? '<br>忽略原因：' + ui.esc(c.ignoreReason || '未填写') + '　忽略时间：' + ui.esc(c.ignoredAt || '—') : '') +
      '</div>';
  }

  function rowHtml(c, tab) {
    var actions = '';
    if (tab === '写入失败') {
      actions = businessFail(c)
        ? '<div class="ry-acts-row" style="margin-top:8px">' +
            '<button class="ry-btn" data-expl="' + ui.esc(c.id) + '">补齐前提条件后重试</button>' +
            '<button class="ry-btn ry-btn--primary" data-probe="' + ui.esc(c.id) + '">验证：直接重试（预期被拒绝）</button></div>'
        : '<div class="ry-acts-row" style="margin-top:8px">' +
            '<button class="ry-btn ry-btn--primary" data-retry="' + ui.esc(c.id) + '">按原参数重试写入</button>' +
            '<a class="ry-btn" href="' + RY.nav.href('h5/task/list.html') + '">手工接管</a></div>';
    } else if (tab === '已失效') {
      actions = '<div class="ry-acts-row" style="margin-top:8px">' +
        '<a class="ry-btn ry-btn--primary" href="' + RY.nav.href('h5/agent/organize.html') + '">基于最新来源重新生成</a>' +
        '<button class="ry-btn" data-why="' + ui.esc(c.id) + '">失效原因</button></div>';
    } else if (c.status === '待确认') {
      actions = '<div class="ry-acts-row" style="margin-top:8px">' +
        '<a class="ry-btn ry-btn--primary" href="' + RY.nav.href('h5/agent/confirm.html') + '">逐条确认</a>' +
        '<a class="ry-btn" href="' + RY.nav.href('h5/agent/confirm.html') + '">忽略（不写入）</a></div>';
    } else {
      actions = '<div class="ry-acts-row" style="margin-top:8px">' +
        '<a class="ry-btn" href="' + RY.nav.href('h5/agent/confirm.html') + '">查看候选详情</a></div>';
    }
    return '<div class="ap-row">' + head(c) + meta(c) + actions + '</div>';
  }

  function render() {
    var tabsList = S.candidateList({ age: '历史待处理' });
    var fail = S.candidateList({ writeFail: true });
    var inv = invalidList();
    var runs = failedRuns();

    var html = '';

    html += '<div class="ry-brief">' +
      '<div class="ry-brief__row"><span class="ry-brief__k">AI 待处理</span>' +
        '<span>' + ui.tag('历史待处理 ' + tabsList.length + ' 条', 'warn') + ' ' +
        ui.tag('写入失败 ' + fail.length + ' 条', 'bad') + ' ' + ui.tag('已失效 ' + inv.length + ' 条', 'muted') + '</span></div>' +
      '<p class="ry-hint">本页集中处理三类异常态：长期未处理（仍为待确认）、写入失败（已确认但未写入）、已失效（来源变化，不可继续确认）。' +
      '候选主状态永远只有四态，写入状态与主状态独立。</p></div>';

    html += '<div class="ry-fbar"><div class="ry-fbar__seg">' + tabs().map(function (t) {
      return '<button type="button" class="' + (state.tab === t ? 'is-on' : '') + '" data-tab="' + t + '">' + t + '</button>';
    }).join('') + '</div></div>';

    if (state.tab === '历史待处理') {
      html += ui.banner('长期未处理候选主状态仍是「待确认」，只是从默认列表进入「历史待处理」：它不是失效、不是忽略，' +
        '仍可逐条确认或忽略。历史待处理时间是可配置业务参数，不作为失效时间。', 'info');
      html += tabsList.length ? tabsList.map(function (c) { return rowHtml(c, '历史待处理'); }).join('')
        : ui.empty('当前没有进入历史待处理的候选。');
    }

    if (state.tab === '写入失败') {
      html += ui.banner('写入失败分两类：技术异常（可重试）按原参数重试，沿用原幂等键，不重复创建正式对象；' +
        '业务异常（不可自动重试）必须先补齐前提条件或手工接管。重试前重新鉴权并校验对象、版本与业务状态，禁止机械重试。', 'warn');
      html += fail.length ? fail.map(function (c) { return rowHtml(c, '写入失败'); }).join('')
        : ui.empty('当前没有写入失败的候选。');
      html += '<p class="ry-hint">「候选已确认 + 写入失败」是合法组合：确认动作已完成，失败只影响写入；原确认人可重试，' +
        '技术处理人员只处理技术故障，不得修改业务内容或替销售重新确认。</p>';
    }

    if (state.tab === '已失效') {
      html += ui.banner('已失效候选不能继续确认，也不参与任何批量确认：上下文切换、来源更新／删除、用户撤权、对象失效或状态不允许写入时都会失效。' +
        '来源变化不得原地覆盖，须基于最新来源重新生成。', 'bad');
      html += inv.length ? inv.map(function (c) { return rowHtml(c, '已失效'); }).join('')
        : ui.empty('当前没有已失效的候选。');
    }

    /* AI 生成失败：输入保留，可重试或手工接管 */
    html += '<div class="ry-sec">AI 生成失败的运行记录</div>';
    html += runs.length ? runs.map(function (r) {
      return '<div class="ap-row">' +
        '<div class="ap-row__t"><b>' + ui.esc(r.ability) + '</b>' + ui.statusTag('失败') + '</div>' +
        '<div class="ap-row__m">Run ID <code>' + ui.esc(r.id) + '</code>　来源类型：' + ui.esc(r.origin) + '<br>' +
        '发起人：' + ui.esc(S.userName(r.userId)) + '　开始：' + ui.esc(r.startedAt) + '　结束：' + ui.esc(r.finishedAt || '—') +
        '　重试 ' + (r.retryCount || 0) + ' 次<br>' +
        '错误码 <code>' + ui.esc(r.errorCode || '—') + '</code>：' + ui.esc(r.errorMessage || '') + '<br>' +
        '候选 ' + (r.candidateCount || 0) + ' 条</div>' +
        '<div class="ry-acts-row" style="margin-top:8px">' +
        '<a class="ry-btn ry-btn--primary" href="' + RY.nav.href('h5/agent/organize.html') + '">输入已保留，重新生成</a>' +
        '<a class="ry-btn" href="' + RY.nav.href('h5/activity/create.html') + '">手工记录销售活动</a>' +
        '<a class="ry-btn" href="' + RY.nav.href('h5/task/list.html') + '">手工创建任务</a></div></div>';
    }).join('') : ui.empty('当前账号范围内没有失败的 AI 运行记录。AI 失败只降低效率：输入保留，可重试或手工接管，不阻断手工主链。');
    html += '<p class="ry-hint">本页只展示 Run ID、能力类型、状态、时间、来源类型、耗时、错误码、重试次数等必要技术元数据；' +
      '默认不展示聊天原文、录音转写全文、图片／文件全文与大圆正文。R5 的 CRM 业务权限不自动转化为 AI 来源全文查看权限。</p>';

    /* 失败分类规则 */
    html += '<div class="ry-hcard" style="margin-top:12px"><div class="ry-hcard__head"><h3>失败分类与重试口径</h3></div>' +
      '<div class="ry-hcard__body">' + ui.kv([
        ['技术异常（可重试）', '接口超时、外部服务瞬时不可用等：可有限自动重试，或由用户按原参数重试；沿用原幂等键，不重复创建正式对象'],
        ['业务异常（不可自动重试）', '对象歧义、权限不足、必填缺失、来源冲突、责任人失效：必须补齐前提条件或手工接管，页面不提供直接重试'],
        ['重试前置校验', '重试前重新鉴权，并重新校验对象、版本与业务状态；业务环境已变化时停止机械重试'],
        ['原确认人', '可重试写入；技术处理人员只处理技术故障，不得修改业务内容或替销售重新确认'],
        ['幂等', '同一候选同一幂等键只允许一次有效写入；重复点击与多端并发都不会产生第二个正式对象']
      ]) + '</div></div>';

    /* 本页契约 */
    html += '<div class="ry-hcard ry-hcard--flat" style="margin-top:14px">' +
      '<div class="ry-hcard__head"><h3>本页契约</h3>' +
      '<div class="ry-hcard__extra"><span class="h5-sec-note">PG-AI-PENDING</span></div></div>' +
      '<div class="ry-hcard__body">' + ui.kv([
        ['页面契约', 'PG-AI-PENDING · AI 待处理'],
        ['所属模块', 'Agent（05 Agent 候选与人工确认）'],
        ['端', '企业微信 H5'],
        ['可进入角色', 'ALL5：R1 销售｜R2 销售主管｜R3 销售运营｜R4 客户数据管理｜R5 系统管理员（仅本人候选；R5 见技术元数据）'],
        ['PRD 来源', 'prd/05 §3.1（AI 待确认：当前待确认／历史待处理／写入失败）与 §4 写入状态、幂等与异常分类'],
        ['覆盖 AC', 'AI-05 AI-34 AI-35 AI-65'],
        ['本页视图', '历史待处理｜写入失败｜失败分类｜按原参数重试｜已失效候选不能继续确认'],
        ['关键边界', '历史待处理仍是待确认、不是失效；已确认＋写入失败是合法组合；业务异常不提供直接重试；重试前重新鉴权校验；已失效候选不参与确认与批量']
      ]) + '</div></div>';

    ui.qs('#ap-host').innerHTML = html;
    bind();
  }

  /* ---------------------------------------------------------- 交互 */

  function bind() {
    ui.qsa('[data-tab]').forEach(function (b) {
      b.addEventListener('click', function () { state.tab = b.getAttribute('data-tab'); render(); });
    });

    ui.qsa('[data-retry]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-retry');
        var c = S.candidate(id);
        ui.confirm({
          title: '按原参数重试写入',
          message: ui.kv([
            ['候选', ui.esc(c.id) + '（' + ui.esc(c.kind) + '）'],
            ['归属对象', (c.relatedObjects || []).map(function (r) { return ui.esc(r.type + ' ' + r.id); }).join('、')],
            ['重试参数', '使用原确认内容与人工修改后的最终值，不改字段值'],
            ['幂等键', '<code>' + ui.esc(c.idemKey) + '</code>（沿用原键，不重复创建）'],
            ['前置校验', '重试前重新鉴权并校验对象、版本与业务状态']
          ]),
          confirmText: '重试写入',
          onConfirm: function () {
            var r = S.candidateRetryWrite(id);
            ui.toast(r.ok ? '重试成功，已写入正式对象。' : r.msg, r.ok ? 'ok' : 'warn');
            render();
          }
        });
      });
    });

    /* 业务异常：验证「不允许直接重试」的边界（AI-35）。 */
    ui.qsa('[data-probe]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-probe');
        var r = S.candidateRetryWrite(id);
        var c = S.candidate(id);
        ui.modal({
          title: r.ok ? '重试已执行' : '重试被拒绝（符合预期）',
          size: 'sm',
          body: '<p>' + ui.esc(r.msg) + '</p>' + ui.kv([
            ['失败分类', ui.esc(c.failKind || '—')],
            ['候选主状态', ui.esc(c.status)],
            ['写入状态', ui.esc(c.writeStatus)],
            ['幂等键', '<code>' + ui.esc(c.idemKey) + '</code>']
          ]) + '<p class="ry-hint">业务异常（对象歧义、权限不足、必填缺失、来源冲突、责任人失效）不得自动重试，' +
            '也不提供无脑重试按钮；必须先补齐前提条件或由人工接管。</p>',
          footer: '<button class="ry-btn ry-btn--primary" data-close>知道了</button>'
        });
        render();
      });
    });

    ui.qsa('[data-expl]').forEach(function (b) {
      b.addEventListener('click', function () {
        var c = S.candidate(b.getAttribute('data-expl'));
        ui.modal({
          title: '补齐前提条件后再重试',
          size: 'sm',
          body: '<p>该条写入失败属于业务异常：</p>' +
            '<p class="ry-ac-msg">' + ui.esc(c.failReason) + '</p>' +
            ui.kv([
              ['失败分类', ui.esc(c.failKind)],
              ['需要补齐', '责任人／验收入相关的组织关系或人员状态（属组织与权限管理范围，不在 Agent 内维护）'],
              ['补齐后动作', '由原确认人按原参数重试；重试前重新鉴权并重新校验对象、版本与业务状态'],
              ['替代路径', '先手工创建正式任务完成业务闭环，候选保留为已确认／写入失败，供质量分析']
            ]) + '<p class="ry-hint">Agent 不因为写入失败而改写候选业务内容，也不自动改责任人；组织关系缺失不能靠 AI 兜底。</p>',
          footer: '<button class="ry-btn" data-close>关闭</button>' +
            '<a class="ry-btn ry-btn--primary" href="' + RY.nav.href('h5/task/list.html') + '">到任务列表手工接管</a>'
        });
      });
    });

    ui.qsa('[data-why]').forEach(function (b) {
      b.addEventListener('click', function () {
        var c = S.candidate(b.getAttribute('data-why'));
        ui.modal({
          title: '候选失效原因',
          size: 'sm',
          body: ui.kv([
            ['候选', ui.esc(c.id) + '　' + ui.esc(c.kind)],
            ['主状态', ui.esc(c.status)],
            ['写入状态', ui.esc(c.writeStatus)],
            ['来源版本', ui.esc(c.sourceVersion)],
            ['失效触发', '来源版本更新（同一来源 v2 → v3）：旧候选失效，须基于最新来源重新生成，来源变化不得原地覆盖']
          ]) + '<p class="ry-hint">其他失效触发条件：上下文切换、来源被删除、用户撤权、正式对象失效或状态已不允许写入。' +
            '撤权后前台不再展示无权原文，审计只保留最小必要元数据。</p>',
          footer: '<button class="ry-btn" data-close>关闭</button>' +
            '<a class="ry-btn ry-btn--primary" href="' + RY.nav.href('h5/agent/organize.html') + '">重新生成</a>'
        });
      });
    });
  }

  render();
})();
</script>
</body>
</html>
